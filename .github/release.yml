changelog:
  categories:
    - title: "🚀 New Features"
      labels:
        - feature
        - enhancement

    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix

    - title: "⚡ Performance Improvements"
      labels:
        - performance

    - title: "🧰 Maintenance"
      labels:
        - chore
        - refactor
        - dependencies

    - title: "⚠️ Breaking Changes"
      labels:
        - breaking

change-template: "- ${{TITLE}} (#${{NUMBER}} by @${{AUTHOR}})"

template: |
  # 🔌 PowerOcean – Release ${{VERSION}}

  Thanks for using the integration ❤️

  ---

  ## 📢 Important

  ⚠️ **Restart Home Assistant after updating.**

  🏠 Minimum Home Assistant version: **2025.2.4**

  ---

  ## 🔄 Changes

  $CHANGES

  ---

  ## 📥 Install / update

  **HACS:**
  HACS → Integrations → Ecoflow PowerOcean → Update

  **Manual:**
  1. Download `powerocean.zip` from this release
  2. Replace `custom_components/powerocean` with its contents
  3. Restart Home Assistant

  ---

  ## 🧪 Tested with

  - Home Assistant Core (current release)
  - Python 3.13
